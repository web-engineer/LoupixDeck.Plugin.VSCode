name: Build

# Compiles the plugin and runs both test suites on every push and pull request, so a broken build
# shows up before a release. Packaging and attaching files to a GitHub Release is release.yml's job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Same layout as on a developer machine: the plugin next to a LoupixDeck checkout whose SDK
      # build is the local package source in nuget.config (SDK 1.30.0 is not on nuget.org yet).
      - uses: actions/checkout@v5
        with:
          path: src/LoupixDeck.Plugin.VSCode

      - uses: actions/checkout@v5
        with:
          repository: RadiatorTwo/LoupixDeck.PluginSdk
          path: src/LoupixDeck/LoupixDeck.PluginSdk

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build Plugin SDK package
        run: dotnet build src/LoupixDeck/LoupixDeck.PluginSdk -c Release

      # LoupixSkipInstall: the runner has no LoupixDeck plugin folder to copy into. The build also
      # packs the companion extension into loupixdeck-companion.vsix.
      - name: Build
        run: dotnet build src/LoupixDeck.Plugin.VSCode/LoupixDeck.Plugin.VSCode.csproj -c Release -p:LoupixSkipInstall=true -warnaserror

      - name: Test
        run: dotnet test src/LoupixDeck.Plugin.VSCode/tests/LoupixDeck.Plugin.VSCode.Tests -c Release

      # The companion has no runtime dependencies, so its tests run without npm install.
      - name: Test companion extension
        working-directory: src/LoupixDeck.Plugin.VSCode/extension
        run: npm test
